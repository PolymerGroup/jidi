<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img" aria-label="Glutathione lyophilized research vial illustration">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset=".48" stop-color="#e4f2f5" stop-opacity=".62"/>
      <stop offset="1" stop-color="#b8d3dc" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf4f7"/>
      <stop offset=".55" stop-color="#c8d8df"/>
      <stop offset="1" stop-color="#a9bec8"/>
    </linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#eee7d4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <ellipse cx="180" cy="505" rx="128" ry="18" fill="#082c47" opacity=".2" filter="url(#shadow)"/>
  <!-- cap -->
  <rect x="118" y="32" width="124" height="62" rx="8" fill="url(#cap)" stroke="#8faab6"/>
  <ellipse cx="180" cy="34" rx="62" ry="12.5" fill="#e9f1f4" stroke="#8faab6"/>
  <g stroke="#8faab6" opacity=".55">
    <line x1="128" y1="42" x2="128" y2="86"/><line x1="140" y1="42" x2="140" y2="86"/>
    <line x1="152" y1="42" x2="152" y2="86"/><line x1="164" y1="42" x2="164" y2="86"/>
    <line x1="176" y1="42" x2="176" y2="86"/><line x1="188" y1="42" x2="188" y2="86"/>
    <line x1="200" y1="42" x2="200" y2="86"/><line x1="212" y1="42" x2="212" y2="86"/>
    <line x1="224" y1="42" x2="224" y2="86"/><line x1="236" y1="42" x2="236" y2="86"/>
  </g>
  <ellipse cx="180" cy="35" rx="4" ry="2.2" fill="#f9fcfd"/>
  <!-- neck -->
  <rect x="138" y="92" width="84" height="52" fill="url(#glass)" stroke="#aac3cc"/>
  <line x1="138" y1="95" x2="138" y2="140" stroke="#aac3cc"/>
  <line x1="222" y1="95" x2="222" y2="140" stroke="#aac3cc"/>
  <!-- body -->
  <rect x="86" y="120" width="188" height="360" rx="22" fill="url(#glass)" stroke="#9dbac4" stroke-width="1.4"/>
  <rect x="94" y="134" width="10" height="322" rx="5" fill="#ffffff" opacity=".7"/>
  <rect x="258" y="138" width="7" height="312" rx="3" fill="#6f98a7" opacity=".16"/>
  <!-- lyophilized cake -->
  <rect x="98" y="400" width="164" height="66" rx="12" fill="url(#cake)" stroke="#ded6c2"/>
  <ellipse cx="180" cy="402" rx="80" ry="13" fill="#fffdf7" opacity=".86"/>
  <g fill="#d8cfb9" opacity=".8">
    <circle cx="130" cy="425" r="1.6"/><circle cx="156" cy="416" r="1.2"/><circle cx="181" cy="430" r="1.7"/>
    <circle cx="209" cy="418" r="1.2"/><circle cx="232" cy="436" r="1.5"/><circle cx="148" cy="448" r="1.1"/>
    <circle cx="198" cy="451" r="1.3"/><circle cx="220" cy="412" r="1"/>
  </g>
  <!-- label -->
  <rect x="96" y="196" width="168" height="186" rx="2" fill="#ffffff" stroke="#c4d6dd"/>
  <rect x="96" y="196" width="168" height="8" fill="#9b5a3c"/>
  <rect x="96" y="204" width="168" height="1.5" fill="#d9a36f"/>
  <text x="106" y="221" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#082c47">JIDI BIO</text>
  <text x="106" y="231" font-family="Consolas, monospace" font-size="4.2" letter-spacing=".4" fill="#6a7f89">RESEARCH REAGENT</text>
  <line x1="106" y1="240" x2="254" y2="240" stroke="#d6e1e5"/>
  <text x="180" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#10232f">Glutathione</text>
  <text x="180" y="292" text-anchor="middle" font-family="Consolas, monospace" font-size="5.7" fill="#4f6671">CAS 70-18-8</text>
  <text x="180" y="308" text-anchor="middle" font-family="Consolas, monospace" font-size="5.1" fill="#0c6875">RP-HPLC ≥99% TARGET</text>
  <text x="180" y="321" text-anchor="middle" font-family="Consolas, monospace" font-size="4.6" fill="#4f6671">LYOPHILIZED · 10 VIALS</text>
  <rect x="106" y="333" width="148" height="14" fill="#f8eee7"/>
  <text x="180" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="5.4" font-weight="700" fill="#8a4320">FOR RESEARCH USE ONLY</text>
  <text x="180" y="360" text-anchor="middle" font-family="Consolas, monospace" font-size="3.6" fill="#7c909a">NOT FOR HUMAN OR VETERINARY USE</text>
  <text x="180" y="376" text-anchor="middle" font-family="Consolas, monospace" font-size="3.8" fill="#8fa4ae"></text>
  <!-- bottom marks -->
  <text x="24" y="521" font-family="Consolas, monospace" font-size="5" fill="#082c47" opacity=".55">RUO</text>
  <text x="336" y="521" text-anchor="end" font-family="Consolas, monospace" font-size="4.5" fill="#082c47" opacity=".45">JIDI-BIO</text>
</svg>
